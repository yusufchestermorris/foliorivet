[package]
name = "foliorivet-python"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
wordcraft-engine = { path = "../../crates/engine" }
serde_json = "1"
pyo3 = { version = "=0.27.2", features = ["extension-module"] }

[lints.rust]
unsafe_code = "forbid"

# Keep Python build dependencies outside the upstream Rust/wasm workspace.
[workspace]
resolver = "3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
