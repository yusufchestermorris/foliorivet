# Modified for FolioRivet: native template fork changes; see docs/release/STATUS.md (2026-11-06).
[package]
name = "wordcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft command line: convert, inspect, render, run commands, MCP server"

[[bin]]
name = "wordcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-zotero = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"

# FolioRivet distribution entry point; original binary retained for upstream tooling.
[[bin]]
name = "foliorivet-cli"
path = "src/main.rs"
