site_name: FolioRivet
site_description: Documentation for FolioRivet 0.1.0a1 Python bindings â€” Headless DOCX template engine
site_author: FolioRivet Contributors

docs_dir: docs
site_dir: site

# Local records must never enter the public site.
exclude_docs: |
  wordcraft/
  release/0.1.0-preparation.md
  release/PREVIEW-VALIDATION.md
  release/brand-removal.json

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

exclude_docs: |
  brand/*
  images/*
  release/*
  wordcraft/*
  architecture.md
  contributors.md
  control-protocol.md
  egui-037-migration-plan.md
  file-format-parity.md
  gaps.md
  hardware-parity.md
  layout-parity.md
  localization-*.md
  mcp.md
  odf-interpretation.md
  odt-element-audit.md
  parity-checklist.md
  recovery.md
  releasing.md
  roadmap.md
  shared-pdf.md
  spelling-*.md
  target-app-parity.md
  typing-parity.md
  ui-parity.md
  zotero.md

